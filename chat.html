<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url("https://ylnas.com/wp-content/uploads/2024/02/scale_1200.jpeg")
        }

        .chat-container {
            width: 600px;
            max-width: 90%;
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .messages {
            height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .messege {
            max-width: 70%;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 10px;
        }

        .sent {
            align-self: flex-end;
            background-color: #dcf8c6;
        }

        .received{
            align-self: flex-start;
            background-color: #e5e5ea;
        }

        .input-container {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        button {
            margin-left: 5px;
            padding: 8px 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: alias;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="messages" id="messages"></div>
        <div class="input-container">
            <input type="text" id="usernameInput" placeholder="Введите имя...">
            <input type="text" id="messageInput" placeholder="Введите сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        const div = document.querySelector("#messages")
const Iusername = document.querySelector("#usernameInput")
const Imessages = document.querySelector("#messageInput")

async function historyRead() {

    let responses = await fetch("http://192.168.1.208:8000/chat")

    let messages = await responses.json()

    div.innerHTML = ""

    messages.forEach(mes => {
        let divm = document.createElement("div")

        if(mes.username !== Iusername.value){
            divm.classList.add("messege", "received")
            divm.textContent = mes.username + ": " + mes.text_message
        }
        else{
            divm.classList.add("messege", "sent")
            divm.textContent = mes.text_message
        }

        

        div.appendChild(divm)
    });

}

async function sendMessage() {
    let text_message = Imessages.value.trim()
    if(text_message === "") return;

    let user_name = Iusername.value.trim()
    if(user_name === "") return;

    let data = {
            "text_message":text_message,
            "username": user_name
    }

    let fetchparam = {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    }

    await fetch("http://192.168.1.208:8000/send_message", fetchparam)

    Imessages.value = '';

}



setInterval(historyRead, 500)
    </script>
</body>

</html>
