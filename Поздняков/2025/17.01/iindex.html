<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <canvas class="rects" width="600" height="300" style="border: solid;"></canvas>
    <script>
        let canvas = document.querySelector(".rects");
        let rects = canvas.getContext("2d");

        let x = 100;
        let y = 100;
        let dx = 5;
        let dy = 5;
        let size = 20;

        let x2 = 200;
        let y2 = 200;
        let dx2 = -5;
        let dy2 = -5;
        let size2 = 20;

        // Функция для проверки пересечения прямоугольников
        function isCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return (
                x1 < x2 + w2 &&
                x1 + w1 > x2 &&
                y1 < y2 + h2 &&
                y1 + h1 > y2
            );
        }

        function update() {
            rects.fillStyle = "white";
            cts.fillRect(0, 0, 600, 300);

            if (x < 0 || x > 600 - size) {
                dx *= -1;
            }

            if (y < 0 || y > 300 - size) {
                dy *= -1;
            }

            if (x2 < 0 || x2 > 600 - size2) {
                dx2 *= -1;
            }

            if (y2 < 0 || y2 > 300 - size2) {
                dy2 *= -1;
            }

            // Проверяем столкновение квадратиков
            if (isCollision(x, y, size, size, x2, y2, size2, size2)) {
                dx *= -1;
                dy *= -1;
                dx2 *= -1;
                dy2 *= -1;
            }

            x += dx;
            y += dy;
            rects.fillStyle = "black";
            rects.fillRect(x, y, size, size);

            x2 += dx2;
            y2 += dy2;
            rects.fillStyle = "red";
            rects.fillRect(x2, y2, size2, size2);
        }

        setInterval(update, 20);
    </script>
</body>

</html>
