<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background-image: url("https://i.pinimg.com/736x/56/41/22/5641221e5c104f6aa7d17486933ddb21.jpg");
            transition: 2s;
        }
        body:hover{
            background-color: aqua;
            background-size: cover;
        }
        p{
            margin: 0;
            font-weight: 700;
            transition: 2s;
        }
        img{
            height: 100px;
            width: 300px;
            transition: 2s;
        }
        img:hover{
            height: 300px;
            width: 100px;
            transform: rotate(0.5turn);
        }
        p:hover{
            color:red;
            transform: scale(2, 0.5);
            background-color: brown;
        }
    </style>
</head>
<body>
    <img src="https://avatars.mds.yandex.net/get-kinopoisk-image/1777765/7aaed74d-49e8-4caa-b043-6cec5347fa73/1920x">
    <div>
        <p>"Улыбаемся и машем, парни! Улыбаемся и машем!"</p>
    </div>
    <p>-Рандомный пингвин</p>
</body>
</html>
