<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        button{
            display: inline;
            border-radius: 30px;
            border-color: #28A745;
            color: #28A745;
            font-size: 30px;
            font-weight: 700;
            border-width: 10px;
            padding: 6px 12px 6px 12px;
            background-color:chartreuse;
        }
        span{
            font-size: 30px;
            font-weight: 700;
            color: chartreuse;
            background-color: #28A745;
            border-radius: 700px;
        }
    </style>
</head>
<body>
    <button onclick="ddaas(1)">Click <span id="count">0</span></button>
    <button onclick="ddaas(-1)">Click</button>
    <script>
        var nowchisl = 1;


        var ddaas = (num) => {
            document.getElementById("count").innerHTML = nowchisl
            nowchisl += num
        }
    </script>
</body>
</html>
