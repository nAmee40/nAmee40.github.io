<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Работа с фоном</title>
    <style>
        div{
            width: 1000px;
            height:200px;
             padding: 50px;
             color: white;
             font-size:40px;
        }
        .backgroundRepeat {
             background-color: #362C36;
            background-image: url("https://www.meme-arsenal.com/memes/62fb0d2968cf1a85ab5d68013f0ce967.jpg");
            background-repeat: repeat-y;
        }
        .backgroundSize {
            background-color: #4D4C59;
            background-image: url("https://www.meme-arsenal.com/memes/62fb0d2968cf1a85ab5d68013f0ce967.jpg");
            background-size : contain;
        }
        .backgroundPosition {
            background-color: #71777D;
            background-image: url("https://www.meme-arsenal.com/memes/62fb0d2968cf1a85ab5d68013f0ce967.jpg");
            background-position : left bottom;
            background-repeat: no-repeat;
        }
</style>
</head>
<body>
    <div class="backgroundRepeat">
            Замени background-repeat: repeat  на
        <ul>
            <li>background-repeat: no-repeat; </li>
            <li>background-repeat: repeat-x; </li>
            <li>background-repeat: repeat-y; </li>
        </ul>
    </div>
    <div class="backgroundSize">
            Замени background-size : 180px  на
        <ul>
            <li>background-size : cover ; </li>
            <li>background-size : contain; </li>
        </ul>
    </div>
    <div class="backgroundPosition">
            Замени background-position: left bottom 
            на top left;
    </div>
</body>
</html>
